<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <style>
        form{
            text-align: center;
            
        }
    </style>
</head>
<body>
    <form>
        <label for="Full Name">Full Name :</label>
        <input type="text" id="name" name="Full Name" placeholder="Enter your Name">
        <br><br>
        <label for="Email">Email :</label>
        <input type="text" id="email" name="email" placeholder="Enter your Email id">
        <br><br>
        <label for="Phone Number">Phone Number :</label>
        <input type="number" id="number" name="phone number" placeholder="Enter phone number">
        <br><br>
        <label for="Branch"> Branch :</label>
        <input type="text" id="branch" name="branch" placeholder="Enter your Branch">
        <br><br>
        <label for="Section"> Section :</label>
        <input type="text" id="Section" name="Section" placeholder="Enter your Section">
        <br><br>
        <button>Submit</button>
        </form>
</body>
</html>
